name: Package HTML5 game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build itch.io HTML5 ZIP
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cd dist
          zip -9 ../gravity-shift-html5.zip index.html
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-shift-html5
          path: gravity-shift-html5.zip
          if-no-files-found: error
          retention-days: 30
